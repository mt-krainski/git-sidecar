name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tools
        run: |
          pipx install poethepoet
          pipx install pre-commit

      - name: Set up project
        run: poe configure

      - name: Run tests
        run: poe test-full

      - name: Run lint
        run: poe lint

      - name: Run hooks
        run: poe hooks-run

  container:
    name: "Container"
    runs-on: ubuntu-latest

    # The unit suite imports the package; this job runs the artifact the
    # deployment runs. A dependency that resolves differently under
    # `uv sync --frozen --no-dev` shows up here and nowhere else.
    env:
      SIDECAR_CONTAINER_URL: http://127.0.0.1:8900/mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build the image
        run: docker build -t git-sidecar:ci .

      # A repository to serve, so the smoke test covers the tools shelling out
      # to the git the image installs, not only the server answering.
      - name: Prepare a fixture repository
        run: |
          mkdir -p fixture/my-org/my-repo
          git init --initial-branch=main fixture/my-org/my-repo
          printf 'test-token' > fixture/my-org/my-repo/.git-sidecar-token
          chmod -R a+rwX fixture

      - name: Start the sidecar
        run: |
          docker run -d --name git-sidecar-ci -p 127.0.0.1:8900:8900 \
            -v "$PWD/fixture:/projects" git-sidecar:ci

      # The published port answers as soon as Docker binds it, so readiness
      # has to come from the application. Any HTTP status means the server
      # answered; curl reports 000 when nothing is listening yet.
      - name: Wait for the sidecar to answer
        run: |
          for _ in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8900/mcp || true)
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "The sidecar did not answer on port 8900 within 120s." >&2
          exit 1

      # The container tests skip themselves when SIDECAR_CONTAINER_URL is unset,
      # and a skipped test still exits zero. Assert they ran, so a green job
      # cannot mean the variable went missing.
      - name: Drive an MCP session against the container
        run: |
          uv run pytest tests/test_transport.py -k container -rs \
            --junit-xml=container-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("container-results.xml").getroot()
          suite = root[0] if root.tag == "testsuites" else root
          ran = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))

          if ran < 1 or skipped:
              raise SystemExit(
                  f"container tests did not run: {ran} collected, {skipped} skipped"
              )
          print(f"container tests ran: {ran}")
          PY

      - name: Show the container log
        if: always()
        run: docker logs git-sidecar-ci

  dependabot:
    name: "Dependabot"
    needs: [test, container]
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}}
    permissions:
      contents: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
